[package]
name = "agy-switch"
version = "4.10.18-lite"
description = "Lightweight headless Antigravity account switcher CLI"
edition = "2021"

[[bin]]
name = "agy-switch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "socks", "system-proxy", "http2"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
